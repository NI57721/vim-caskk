name: Vim CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Vim ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: HEAD
            ref: HEAD
          - version: 9.1.1826
            ref: refs/tags/v9.1.1826
    env:
      LANG: C.UTF-8
      TERM: xterm
    steps:
      - uses: actions/checkout@v6
      - name: Build Vim
        env:
          VIM_REF: ${{ matrix.ref }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          git init "$RUNNER_TEMP/vim-src"
          cd "$RUNNER_TEMP/vim-src"
          git fetch --depth 1 https://github.com/vim/vim.git "$VIM_REF"
          git checkout --detach FETCH_HEAD
          ./configure --with-features=huge --disable-gui --without-x --prefix="$RUNNER_TEMP/vim"
          make -j"$(nproc)"
          make install
          echo "$RUNNER_TEMP/vim/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          git clone --depth 1 https://github.com/thinca/vim-themis.git "$RUNNER_TEMP/vim-themis"
          vim --version
          "$RUNNER_TEMP/vim-themis/bin/themis" --runtimepath . test
